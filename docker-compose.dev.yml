services:
  postgres:
    image: postgres:16-alpine
    container_name: auth_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_DATABASE:-auth_db}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_DATABASE:-auth_db}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - auth_network_dev

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth_app_dev
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: development
    volumes:
      - ./src:/usr/src/app/src
      - ./package.json:/usr/src/app/package.json
      - ./tsconfig.json:/usr/src/app/tsconfig.json
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auth_network_dev

networks:
  auth_network_dev:
    driver: bridge

volumes:
  postgres_data_dev:
